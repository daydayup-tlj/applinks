<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ECFEFF" />
  <title>My Apps · 我的应用</title>

  <!-- Tailwind CDN（静态部署用，单文件即可） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* 顶部品牌渐变背景（淡雅、不抢图标） */
    .hero-bg {
      background:
        radial-gradient(1200px 600px at 50% -10%, #ECFEFF 0%, transparent 60%),
        radial-gradient(800px 400px at 90% 10%, #FEF3C7 0%, transparent 55%),
        radial-gradient(800px 400px at 10% 10%, #DBEAFE 0%, transparent 55%),
        #FFFFFF;
    }

    /* 应用卡片的悬停与聚焦效果 */
    .app-card {
      transition: transform 200ms ease, box-shadow 200ms ease,
        background-color 200ms ease, border-color 200ms ease;
    }
    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px -10px rgba(8, 145, 178, 0.25),
        0 4px 10px -4px rgba(15, 23, 42, 0.08);
    }
    /* 点击后不显示选中/高亮状态（保留键盘 :focus-visible 可达性） */
    .app-card:focus,
    .app-card:active,
    .app-card:visited {
      outline: none;
      box-shadow: none;
    }
    .app-card:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.35);
    }

    /* 图标轻微 3D 浮起 */
    .app-icon {
      transition: transform 250ms ease, filter 250ms ease;
      box-shadow: 0 8px 20px -8px rgba(15, 23, 42, 0.18);
    }
    .app-card:hover .app-icon {
      transform: translateY(-2px) scale(1.02);
      filter: drop-shadow(0 10px 14px rgba(8, 145, 178, 0.25));
    }

    /* 跟随系统暗色模式，仅做最小适配 */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
      }
      .hero-bg {
        background:
          radial-gradient(1200px 600px at 50% -10%, #0E7490 0%, transparent 60%),
          radial-gradient(800px 400px at 90% 10%, #92400E 0%, transparent 55%),
          radial-gradient(800px 400px at 10% 10%, #1E3A8A 0%, transparent 55%),
          #0B1220;
      }
      body {
        color: #E2E8F0;
      }
      .card-surface {
        background-color: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.08);
      }
      .text-muted {
        color: #94A3B8;
      }
    }

    /* 减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
      .app-card,
      .app-icon {
        transition: none !important;
      }
      .app-card:hover {
        transform: none;
      }
      .app-card:hover .app-icon {
        transform: none;
      }
    }
  </style>
</head>
<body class="hero-bg min-h-screen text-slate-900">
  <main class="mx-auto max-w-3xl px-5 pb-16 pt-14 sm:pt-20">
    <!-- 顶部标题区 -->
    <header class="mb-10 text-center sm:mb-14">
      <p
        class="mb-3 inline-flex items-center gap-2 rounded-full border border-cyan-200/70 bg-cyan-50/70 px-3 py-1 text-xs font-medium text-cyan-700"
        data-i18n="badge"
      >
        iOS · Made with care
      </p>
      <p
        class="mx-auto mt-3 max-w-md text-sm text-slate-600 sm:text-base"
        data-i18n="subtitle"
      >
        点击图标前往 App Store 下载或查看详情。
      </p>
    </header>

    <!-- App 网格 -->
    <section
      class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-6"
      aria-label="App list"
    >
      <!-- 1. 超人记账 / SuperBill -->
      <a
        href="#"
        data-app-id="6757777411"
        data-name-zh="超人记账"
        data-name-en="SuperBill"
        aria-label="Open SuperBill on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_superbill.png"
            alt="超人记账 / SuperBill"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            超人记账
          </p>
          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">
            App Store
          </p>
        </div>
      </a>

      <!-- 2. 超好记 / Supernote -->
      <a
        href="#"
        data-app-id="6751161764"
        data-name-zh="超好记"
        data-name-en="Supernote"
        aria-label="Open Supernote on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_supernote.jpg"
            alt="超好记 / Supernote"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            超好记
          </p>
          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">
            App Store
          </p>
        </div>
      </a>

      <!-- 3. 小星星自律 / StarHabbit -->
      <a
        href="#"
        data-app-id="6768335779"
        data-name-zh="小星星自律"
        data-name-en="StarHabbit"
        aria-label="Open StarHabbit on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_starhabbit.jpg"
            alt="小星星自律 / StarHabbit"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            小星星自律
          </p>
          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">
            App Store
          </p>
        </div>
      </a>

      <!-- 4. 圈圈提醒 / Remindays -->
      <a
        href="#"
        data-app-id="6791027521"
        data-name-zh="圈圈提醒"
        data-name-en="Remindays"
        aria-label="Open Remindays on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_remindays.png"
            alt="圈圈提醒 / Remindays"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            圈圈提醒

          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">
            App Store
          </p>
        </div>
      </a>

      <!-- 5. 超能计算器 / SuperCalculator -->
      <a
        href="#"
        data-app-id="6761328929"
        data-name-zh="超能计算器"
        data-name-en="SuperCalculator"
        aria-label="Open SuperCalculator on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_supercalculator.jpg"
            alt="超能计算器 / SuperCalculator"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            超能计算器
          </p>
          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">
            App Store
          </p>
        </div>
      </a>

      <!-- 6. 密盾 / KeyBox -->
      <a
        href="#"
        data-app-id="6785874577"
        data-name-zh="密盾"
        data-name-en="KeyBox"
        aria-label="Open KeyBox on App Store"
        class="app-card card-surface group flex flex-col items-center gap-3 rounded-2xl border border-slate-200/80 bg-white/80 p-4 backdrop-blur-sm sm:p-5"
      >
        <div class="app-icon overflow-hidden rounded-[28%]">
          <img
            src="./images/logo_keybox.jpg"
            alt="密盾 / KeyBox"
            class="block h-20 w-20 sm:h-24 sm:w-24"
            loading="lazy"
          />
        </div>
        <div class="text-center">
          <p class="app-name text-sm font-semibold text-slate-900 sm:text-base">
            密盾
          </p>
          <p class="mt-1 text-xs text-slate-500 group-hover:text-cyan-700">

        </div>

    </section>

    <!-- 底部说明 -->
    <footer
      class="mt-12 text-center text-xs text-slate-500 sm:text-sm"
      data-i18n="footer"
    >
      © <span id="year"></span> My Apps · 在 App Store 中打开对应详情页
    </footer>
  </main>

  <script>
    // ===== 国际化文案 =====
    const i18n = {
      zh: {
        badge: "iOS · 精心打造",
        subtitle: "点击图标前往 App Store 下载或查看详情。",
        footer: "© <span id=\"year\"></span> My Apps · 在 App Store 中打开对应详情页",
        ariaSuffix: "在 App Store 中打开",
      },
      en: {
        badge: "iOS · Made with care",
        subtitle:
          "Tap an icon to open the App Store page and download.",
        footer:
          '© <span id="year"></span> My Apps · Opens the App Store detail page',
        ariaSuffix: "Open on App Store",
      },
    };

    // 判断语言：中文（含 zh-CN、zh-Hans、zh-Hant 等）显示中文，否则英文
    function detectLang() {
      const raw =
        (navigator.language ||
          navigator.userLanguage ||
          (navigator.languages && navigator.languages[0]) ||
          "en")
          .toLowerCase()
          .trim();
      // 含 zh 即视为中文（包括简体/繁体、地区变体）
      return raw.startsWith("zh") ? "zh" : "en";
    }

    function applyI18n(lang) {
      const dict = i18n[lang] || i18n.en;

      // 替换通用文本
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] != null) {
          // 允许 footer 等含 HTML 的字段
          el.innerHTML = dict[key];
        }
      });

      // 更新每个 app 名字
      document.querySelectorAll(".app-card").forEach((card) => {
        const name = card.getAttribute(lang === "zh" ? "data-name-zh" : "data-name-en");
        const nameEl = card.querySelector(".app-name");
        if (name && nameEl) nameEl.textContent = name;

        const ariaLabel = `${name || ""} · ${dict.ariaSuffix}`;
        card.setAttribute("aria-label", ariaLabel);
        card.setAttribute("href", buildAppStoreUrl(card.dataset.appId));
      });

      // 设置 <html lang>
      document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
    }

    // ===== App Store 跳转链接（中国区用 /cn/app/，其它用 /us/app/，未识别时回退 /us/） =====
    function buildAppStoreUrl(appId) {
      const lang = (navigator.language || "en").toLowerCase();
      // 如需全球通用，可全部使用 itunes.apple.com；中国区 ID 也可在全球区访问
      return `https://apps.apple.com/app/id${appId}`;
    }

    // ===== 启动 =====
    document.addEventListener("DOMContentLoaded", () => {
      const lang = detectLang();
      applyI18n(lang);

      // 年份
      const y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();

      // 为中英文显式切换的语言按钮留钩子（如需添加）
    });
  </script>
</body>
</html>
